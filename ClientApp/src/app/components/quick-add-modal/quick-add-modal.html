@if (isOpen) {
<div class="modal-backdrop" (click)="close()">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="quick-add-title"
        (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h2 id="quick-add-title">{{ dialogTitle }}</h2>
            <button type="button" class="close-button" (click)="close()" aria-label="Close quick add dialog">
                ×
            </button>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="spending-form">
            <label>
                <span>Amount</span>
                <input type="number" min="0.01" step="0.01" formControlName="amount" placeholder="0.00" />
            </label>

            <label>
                <span>Category</span>
                <select formControlName="category" (change)="onCategoryChange()">
                    @for (category of categories; track category) {
                    <option [value]="category">{{ category }}</option>
                    }
                </select>
            </label>

            <label>
                <span>Subcategory</span>
                <select formControlName="subcategory">
                    @for (subcategory of subcategories; track subcategory) {
                    <option [value]="subcategory">{{ subcategory }}</option>
                    }
                </select>
            </label>

            <div class="secondary-row">
                <label class="date-field">
                    <span>Date</span>
                    <input type="date" formControlName="date" class="border border-gray-300 rounded-lg px-3 py-2" />
                </label>
            </div>

            <div class="actions">
                <button type="button" class="secondary-button" (click)="close()">Cancel</button>
                <button type="submit" class="primary-button">{{ submitLabel }}</button>
            </div>
        </form>
    </div>
</div>
}
